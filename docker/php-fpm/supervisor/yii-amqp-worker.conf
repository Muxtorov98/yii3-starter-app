;/etc/supervisor/conf.d/yii-amqp-worker.conf
[program:yii-amqp-worker]
command=php /var/www/html/console/yii waybill-worker/start
user=root
numprocs=1
autostart=true
autorestart=true
startretries=3
stopwaitsecs=10
stdout_logfile=/var/log/supervisor/yii-amqp-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/yii-amqp-worker-error.log
stderr_logfile_maxbytes=50MB
process_name=%(program_name)s_%(process_num)02d

