services:
  php:
    container_name: ${DOCKER_PROJECT_NAME}_php
    restart: unless-stopped
    build: ./docker/php-fpm
    env_file:
      - .env
    volumes:
      - ./:/var/www/html
      - ./docker/php-fpm/php.ini:/usr/local/etc/php/php.ini
      - ./docker/php-fpm/error_logs:/var/log/php
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend_net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    container_name: ${DOCKER_PROJECT_NAME}_nginx
    image: nginx:1.19-alpine
    restart: unless-stopped
    volumes:
      - ./docker/nginx/logs:/var/log/nginx
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    ports:
      - 127.0.0.1:${DOCKER_NGINX_PORT}:80
    networks:
      - backend_net

  postgres:
    image: postgres:15-alpine
    restart: always
    container_name: ${DOCKER_PROJECT_NAME}_postgres
    ports:
      - 127.0.0.1:${DOCKER_DATABASE_PORT}:5432
    volumes:
      - ./docker/postgres/db:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_DB: ${DOCKER_PROJECT_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DOCKER_PROJECT_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend_net

  redis:
    image: redis:6.0.10-alpine
    restart: unless-stopped
    container_name: ${DOCKER_PROJECT_NAME}_redis
    networks:
      - backend_net

networks:
  backend_net:
    driver: bridge
